name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: provider-bread-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cpp: ${{ steps.cppfilter.outputs.cpp }}
      docs: ${{ steps.docsfilter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.png'
              - '!**/*.svg'
      # Separate OR-filter (default quantifier) for the C++ sources the clang-tidy
      # gate lints, so it skips (and the ok gate stays green) on non-C++ PRs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: cppfilter
        with:
          filters: |
            cpp:
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '.clang-tidy'
      # What the docs check lints and link-checks (docs/**, root *.md), plus its
      # config, so the docs gate skips (and ok stays green) on PRs that touch none.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: docsfilter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - '.markdownlint.jsonc'
              - '.github/workflows/ci.yml'

  docs:
    name: Docs
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    uses: anolishq/.github/.github/workflows/docs-check.yml@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2

  no-hardware-linux:
    name: ${{ matrix.name }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Build and Test (no hardware)
            os: ubuntu-24.04
            preset: ci-linux-release
            triplet: x64-linux-static
            platform: linux-x86_64
          # arm64 is the Pi deployment arch — run the unit tests natively so
          # arch/filesystem quirks surface at PR time. See anolishq/.github#104.
          - name: Linux ARM64 Build and Test (no hardware)
            os: ubuntu-24.04-arm
            preset: ci-linux-arm64-release
            triplet: arm64-linux
            platform: linux-arm64

    steps:
      - name: Checkout anolis-provider-bread
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: anolis-provider-bread

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2.6
        with:
          triplet: ${{ matrix.triplet }}

      - name: Configure
        working-directory: anolis-provider-bread
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: anolis-provider-bread
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        working-directory: anolis-provider-bread
        run: ctest --preset ${{ matrix.preset }}

      # An unreleased build to try on hardware before a tag: packed as
      # release.yml packs it, and named for the commit built. On a pull
      # request that is the merge of the head into the base.
      - name: Package binary artifact
        id: package
        working-directory: anolis-provider-bread
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          BUILT="$(git rev-parse --short=7 HEAD)"
          NAME="anolis-provider-bread-${BUILT}-${{ matrix.platform }}"
          BINARY="build/${{ matrix.preset }}/anolis-provider-bread"
          if [ ! -f "${BINARY}" ]; then
            echo "ERROR: binary not found at ${BINARY}" >&2
            exit 1
          fi
          mkdir -p staging/bin
          cp "${BINARY}" staging/bin/
          tar -czf "${NAME}.tar.gz" -C staging .
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "${NAME}.tar.gz: built from $(git rev-parse HEAD) (head ${HEAD_SHA})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: anolis-provider-bread/${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  no-hardware-windows:
    name: Windows Build and Test (no hardware)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout anolis-provider-bread
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: anolis-provider-bread

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2.6
        with:
          triplet: x64-windows

      - name: Configure
        working-directory: anolis-provider-bread
        shell: pwsh
        run: cmake --preset ci-windows-release

      - name: Build
        working-directory: anolis-provider-bread
        shell: pwsh
        run: cmake --build --preset ci-windows-release --parallel

      - name: Test
        working-directory: anolis-provider-bread
        shell: pwsh
        run: ctest --preset ci-windows-release

  provider-conformance:
    name: ADPP Conformance (Linux)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout anolis-provider-bread
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: anolis-provider-bread

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2.6
        with:
          triplet: x64-linux-static

      - name: Build provider (no hardware)
        working-directory: anolis-provider-bread
        run: |
          cmake --preset ci-linux-release
          cmake --build --preset ci-linux-release --parallel

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Pull the pinned anolis-protocol[conformance] harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install "anolis-protocol[conformance] @ https://github.com/anolishq/anolis-protocol/releases/download/v1.8.0/anolis_protocol-1.8.0-py3-none-any.whl"

      - name: Run ADPP conformance against the built binary
        working-directory: anolis-provider-bread
        run: |
          anolis-adpp-conformance \
            --provider-bin build/ci-linux-release/anolis-provider-bread \
            --provider-config config/conformance.yaml \
            --provider-profile config/conformance.toml \
            -ra

  version-sync:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: anolishq/.github/.github/workflows/version-sync.yml@7b20551d1532b9e4f1264c9e966fa6ebbf098d75 # v2
    with:
      python-version: '3.12'
      working-directory: '.'

  cpp-format:
    name: C++ Formatting (clang-format)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout anolis-provider-bread
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned clang-tools
        # SHA-verified static LLVM 18.1.8 clang-format on PATH — the org source of
        # truth; install the same pinned binary on dev boxes to match CI. See
        # anolishq/.github#69.
        uses: anolishq/.github/.github/actions/setup-clang-tools@9869a5f4bee7da9c7c1dc9bae033cd0137c4801d # setup-clang-tools
      - name: Check formatting
        run: git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs clang-format --dry-run --Werror

  clang-tidy:
    name: Clang-Tidy (changed lines)
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    permissions:
      contents: read
    uses: anolishq/.github/.github/workflows/clang-tidy-diff.yml@0199b6cc7cb73a02d58f75ec8ed763ac40e54dca # clang-tidy-diff
    with:
      configure-preset: ci-linux-release
      blocking: true

  ok:
    name: ok
    if: always()
    needs:
      - changes
      - docs
      - no-hardware-linux
      - no-hardware-windows
      - provider-conformance
      - cpp-format
      - clang-tidy
      - version-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
