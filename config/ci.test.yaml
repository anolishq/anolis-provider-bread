provider:
  name: bread-ci-test
  # The shell test checks that health reports no contact before any device
  # I/O (#87); safe outputs at startup would be the first I/O (#195).
  outputs_on_startup: leave

hardware:
  bus_path: mock://ci-test
  query_delay_us: 10000
  timeout_ms: 100
  retry_count: 2

discovery:
  mode: manual
  addresses: [0x08, 0x09]

devices:
  - id: rlht0
    type: rlht
    label: Left Heater (CI test)
    address: 0x08
  - id: dcmt0
    type: dcmt
    label: Conveyor Drive (CI test)
    address: 0x09
